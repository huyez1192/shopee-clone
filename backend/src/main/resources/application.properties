spring.application.name=Product-CRUD-API

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/product_crud_db
spring.datasource.username=postgres
spring.datasource.password=huyen

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
app.jwt.secret-key=${JWT_SECRET}
app.jwt.expiration-ms=86400000

sepay.bank-code=${SEPAY_BANK_CODE}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER}
sepay.account-name=${SEPAY_ACCOUNT_NAME}
sepay.webhook-secret=${SEPAY_WEBHOOK_SECRET}

cloudinary.enabled=${CLOUDINARY_ENABLED:false}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
