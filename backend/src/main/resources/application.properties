spring.application.name=Product-CRUD-API

server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
app.jwt.secret-key=${JWT_SECRET}
app.jwt.expiration-ms=86400000

sepay.bank-code=${SEPAY_BANK_CODE}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER}
sepay.account-name=${SEPAY_ACCOUNT_NAME}
sepay.webhook-secret=${SEPAY_WEBHOOK_SECRET}
