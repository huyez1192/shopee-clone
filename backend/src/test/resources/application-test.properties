spring.datasource.url=jdbc:h2:mem:minishopee-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

app.jwt.secret-key=test-only-jwt-secret-key-with-at-least-32-bytes
app.jwt.expiration-ms=86400000

sepay.bank-code=TEST_BANK
sepay.account-number=0000000000
sepay.account-name=MINI SHOPEE TEST
sepay.webhook-secret=test-only-sepay-webhook-secret

cloudinary.enabled=false
